name: iOS shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild -project Shell.xcodeproj -scheme Shell -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Compile unit-test bundle
        run: |
          xcodebuild -project Shell.xcodeproj -scheme Shell -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
