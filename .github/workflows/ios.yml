name: iOS shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild -project Shell.xcodeproj -scheme Shell -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime in d.values() for x in runtime if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(ids[0] if ids else "")')"
          test -n "$UDID"
          xcodebuild -project Shell.xcodeproj -scheme Shell -configuration Debug -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO test
