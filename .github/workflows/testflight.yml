name: TestFlight shell

# Manual-only production-logic upload. Derived repositories reuse this file
# through `workflow_call` from their own manually dispatched workflow instead
# of copying it, so upload fixes reach every app. The caller's repository is
# checked out, and the caller must pass its secrets (`secrets: inherit`).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD SHELL to confirm upload
        required: true
        type: string
      advertising:
        description: Upload the ShellAds target (requires an advertising monetization mode)
        required: false
        type: boolean
        default: false
      marketing_version:
        description: Optional CFBundleShortVersionString override (for example 1.2.0)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      confirmation:
        description: Confirmation text typed by the person who dispatched the caller
        required: true
        type: string
      expected_confirmation:
        description: Exact phrase the caller requires, for example UPLOAD ACME
        required: true
        type: string
      advertising:
        required: false
        type: boolean
        default: false
      marketing_version:
        required: false
        type: string
        default: ""
      bundle_id:
        required: true
        type: string
      app_name:
        required: true
        type: string
      app_sku:
        required: true
        type: string
      team_id:
        required: true
        type: string
      provisioning_profile_name:
        required: true
        type: string
      project:
        required: false
        type: string
        default: Shell.xcodeproj
      scheme:
        description: Defaults to Shell, or ShellAds when advertising is true
        required: false
        type: string
        default: ""
      unit_test_target:
        required: false
        type: string
        default: ShellTests
      generate_project:
        description: Run xcodegen before building
        required: false
        type: boolean
        default: true
      run_shell_validation:
        description: Run scripts/validate-shell.sh before building
        required: false
        type: boolean
        default: true
      jwt_script:
        required: false
        type: string
        default: scripts/app-store-connect-jwt.rb
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_P12:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: shell-testflight-${{ github.repository }}
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: ${{ inputs.bundle_id || vars.IOS_BUNDLE_ID || 'com.goodusestudios.shelllab' }}
  APPLE_TEAM_ID: ${{ inputs.team_id || vars.APPLE_TEAM_ID || '49SQ3XQ68Q' }}
  APP_NAME: ${{ inputs.app_name || vars.APP_NAME || 'GoodUse Shell Lab' }}
  APP_SKU: ${{ inputs.app_sku || vars.APP_SKU || 'gooduse-shell-lab' }}
  PROVISIONING_PROFILE_NAME: ${{ inputs.provisioning_profile_name || vars.PROVISIONING_PROFILE_NAME || 'GoodUse Shell Lab App Store CI' }}
  PROJECT: ${{ inputs.project || 'Shell.xcodeproj' }}
  SCHEME: ${{ inputs.scheme || (inputs.advertising && 'ShellAds') || 'Shell' }}
  ADVERTISING: ${{ inputs.advertising && 'true' || 'false' }}
  UNIT_TEST_TARGET: ${{ inputs.unit_test_target || 'ShellTests' }}
  GENERATE_PROJECT: ${{ (github.event_name == 'workflow_dispatch' || inputs.generate_project) && 'true' || 'false' }}
  RUN_SHELL_VALIDATION: ${{ (github.event_name == 'workflow_dispatch' || inputs.run_shell_validation) && 'true' || 'false' }}
  JWT_SCRIPT: ${{ inputs.jwt_script || 'scripts/app-store-connect-jwt.rb' }}
  MARKETING_VERSION_OVERRIDE: ${{ inputs.marketing_version }}
  ARCHIVE_PATH: ${{ github.workspace }}/build/App.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Confirm trigger
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_CONFIRMATION: ${{ inputs.expected_confirmation || 'UPLOAD SHELL' }}
        run: |
          [[ -n "$EXPECTED_CONFIRMATION" ]] || { echo 'An expected confirmation phrase is required.' >&2; exit 1; }
          [[ "$CONFIRMATION" == "$EXPECTED_CONFIRMATION" ]] || { echo "Confirmation must exactly match $EXPECTED_CONFIRMATION." >&2; exit 1; }
          build_number="$(date -u +%y%m%d%H%M).${GITHUB_RUN_NUMBER}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          if [[ -n "$MARKETING_VERSION_OVERRIDE" ]]; then
            [[ "$MARKETING_VERSION_OVERRIDE" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo 'marketing_version must look like 1, 1.2 or 1.2.3.' >&2; exit 1; }
            echo "VERSION_SETTING=MARKETING_VERSION=$MARKETING_VERSION_OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "VERSION_SETTING=" >> "$GITHUB_ENV"
          fi
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          if [[ "$GENERATE_PROJECT" == "true" ]]; then command -v xcodegen >/dev/null || brew install xcodegen; fi
          xcodebuild -version
      - name: Generate and verify simulator build
        run: |
          if [[ "$RUN_SHELL_VALIDATION" == "true" ]]; then
            if [[ "$ADVERTISING" == "true" ]]; then
              scripts/validate-shell.sh --release-ads
            elif [[ "$IOS_BUNDLE_ID" == "com.goodusestudios.shelllab" ]]; then
              scripts/validate-shell.sh --template
            else
              scripts/validate-shell.sh --release
            fi
          fi
          if [[ "$GENERATE_PROJECT" == "true" ]]; then xcodegen generate; fi
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" $VERSION_SETTING build
      - name: Run unit tests before upload
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |d| d["isAvailable"] && d["name"].start_with?("iPhone") }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Unit tests host the default target; the ads target shares its sources.
          test_scheme="$SCHEME"
          if [[ "$ADVERTISING" == "true" && "$SCHEME" == "ShellAds" ]]; then test_scheme="Shell"; fi
          xcodebuild -project "$PROJECT" -scheme "$test_scheme" -configuration Release -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -only-testing:"$UNIT_TEST_TARGET" test
      - name: Prepare App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          (( ${#missing[@]} == 0 )) || { echo "Missing repository Actions secrets: ${missing[*]}" >&2; exit 1; }
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Ensure bundle ID and private App Store record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          jwt="$(ruby "$JWT_SCRIPT" "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          echo "::add-mask::$jwt"
          echo "ASC_JWT=$jwt" >> "$GITHUB_ENV"
          auth="Authorization: Bearer $jwt"
          bundle_json="$RUNNER_TEMP/bundle.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$bundle_json")"
          if [[ "$count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"bundleIds",attributes:{identifier:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),platform:"IOS"}})' > "$RUNNER_TEMP/create-bundle.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-bundle.json" 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          elif [[ "$count" != "1" ]]; then
            echo 'Bundle ID lookup was ambiguous.' >&2; exit 1
          fi
          bundle_resource_id="$(ruby -rjson -e 'd=JSON.parse(File.read(ARGV[0])).fetch("data"); d=d.fetch(0) if d.is_a?(Array); puts d.fetch("id")' "$bundle_json")"
          echo "BUNDLE_RESOURCE_ID=$bundle_resource_id" >> "$GITHUB_ENV"
          app_json="$RUNNER_TEMP/app.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[bundleId]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          app_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$app_json")"
          if [[ "$app_count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"apps",attributes:{bundleId:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),primaryLocale:"en-US",sku:ENV.fetch("APP_SKU")}})' > "$RUNNER_TEMP/create-app.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-app.json" 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          elif [[ "$app_count" != "1" ]]; then
            echo 'App lookup was ambiguous.' >&2; exit 1
          fi
      - name: Install distribution signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_P12" ]] || { echo 'Missing repository Actions secret: IOS_DISTRIBUTION_CERTIFICATE_P12' >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo 'Missing repository Actions secret: IOS_DISTRIBUTION_CERTIFICATE_PASSWORD' >&2; exit 1; }

          cert_path="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          chmod 600 "$cert_path"

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path" | grep 'Apple Distribution'

          auth="Authorization: Bearer $ASC_JWT"
          profile_json="$RUNNER_TEMP/profiles.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" \
            --data-urlencode "filter[name]=$PROVISIONING_PROFILE_NAME" \
            --data-urlencode 'filter[profileState]=ACTIVE' \
            --data-urlencode 'limit=2' \
            'https://api.appstoreconnect.apple.com/v1/profiles' \
            -o "$profile_json"
          profile_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$profile_json")"
          if [[ "$profile_count" == "0" ]]; then
            # Create the App Store profile against the newest active distribution certificate.
            cert_json="$RUNNER_TEMP/certificates.json"
            curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode 'limit=200' 'https://api.appstoreconnect.apple.com/v1/certificates' -o "$cert_json"
            certificate_id="$(ruby -rjson -rtime -e 'data=JSON.parse(File.read(ARGV[0])).fetch("data"); cert=data.select{|x| %w[DISTRIBUTION IOS_DISTRIBUTION].include?(x.dig("attributes","certificateType")) && Time.parse(x.dig("attributes","expirationDate")) > Time.now}.max_by{|x| Time.parse(x.dig("attributes","expirationDate"))}; abort "No active iOS distribution certificate in Apple account" unless cert; puts cert.fetch("id")' "$cert_json")"
            CERTIFICATE_ID="$certificate_id" ruby -rjson -e 'puts JSON.generate(data:{type:"profiles",attributes:{name:ENV.fetch("PROVISIONING_PROFILE_NAME"),profileType:"IOS_APP_STORE"},relationships:{bundleId:{data:{type:"bundleIds",id:ENV.fetch("BUNDLE_RESOURCE_ID")}},certificates:{data:[{type:"certificates",id:ENV.fetch("CERTIFICATE_ID")}]}}})' > "$RUNNER_TEMP/create-profile.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-profile.json" 'https://api.appstoreconnect.apple.com/v1/profiles' -o "$profile_json"
          elif [[ "$profile_count" != "1" ]]; then
            echo "Expected at most one active profile named $PROVISIONING_PROFILE_NAME; found $profile_count." >&2; exit 1
          fi
          profile_path="$RUNNER_TEMP/app-store.mobileprovision"
          ruby -rjson -rbase64 -e 'data=JSON.parse(File.read(ARGV[0])).fetch("data"); data=data.fetch(0) if data.is_a?(Array); print Base64.decode64(data.fetch("attributes").fetch("profileContent"))' "$profile_json" > "$profile_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          [[ "$profile_name" == "$PROVISIONING_PROFILE_NAME" ]]
          [[ "$app_identifier" == "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          chmod 600 "$profile_dir/$profile_uuid.mobileprovision"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Archive unsigned app
        run: |
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" $VERSION_SETTING clean archive
          app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          while IFS= read -r -d '' framework; do codesign --force --sign - --timestamp=none "$framework"; done < <(find "$app/Frameworks" -depth -type d -name '*.framework' -print0 2>/dev/null || true)
      - name: Export and verify signed IPA
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string "Apple Distribution"' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROVISIONING_PROFILE_NAME" "$export_options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$export_options"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          ditto -x -k "$IPA_PATH" "$verify"
          app="$(find "$verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" == "$BUILD_NUMBER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist")" == "false" ]]
          [[ -f "$app/PrivacyInfo.xcprivacy" ]] || { echo 'The archive has no privacy manifest.' >&2; exit 1; }
          if [[ -n "$MARKETING_VERSION_OVERRIDE" ]]; then
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" == "$MARKETING_VERSION_OVERRIDE" ]]
          fi
          has_ad_metadata=false
          /usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$app/Info.plist" >/dev/null 2>&1 && has_ad_metadata=true
          has_ad_frameworks=false
          find "$app" \( -iname '*GoogleMobileAds*' -o -iname '*UserMessagingPlatform*' \) | grep -q . && has_ad_frameworks=true
          if [[ "$ADVERTISING" == "true" ]]; then
            [[ "$has_ad_metadata" == "true" ]] || { echo 'An advertising archive must declare GADApplicationIdentifier.' >&2; exit 1; }
          else
            [[ "$has_ad_metadata" == "false" ]] || { echo 'An ad-free archive must not contain AdMob metadata.' >&2; exit 1; }
            [[ "$has_ad_frameworks" == "false" ]] || { echo 'An ad-free archive must not contain advertising frameworks.' >&2; exit 1; }
          fi
      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: TestFlight-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
