name: Welding Wallet screenshot TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD WELDING WALLET SCREENSHOT to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: welding-wallet-screenshot-testflight
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: com.goodusestudios.weldinggaswallet
  APPLE_TEAM_ID: 49SQ3XQ68Q
  APP_NAME: Welding Gas Wallet
  APP_SKU: welding-gas-wallet
  SCHEME: WeldingGasWallet
  ARCHIVE_PATH: ${{ github.workspace }}/build/WeldingGasWallet.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out authoritative Welding Wallet iOS source
        uses: actions/checkout@v7
        with:
          repository: lrodeveloperr/welding-wallet-ios
          ref: main

      - name: Confirm screenshot-only upload
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$CONFIRMATION" == "UPLOAD WELDING WALLET SCREENSHOT" ]] || {
            echo 'Confirmation must exactly match UPLOAD WELDING WALLET SCREENSHOT.' >&2
            exit 1
          }
          build_number="$(date -u +%y%m%d%H%M).${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version

      - name: Generate and verify screenshot simulator build
        run: |
          scripts/validate-shell.sh --app
          xcodegen generate
          xcodebuild -project WeldingGasWallet.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" SWIFT_ACTIVE_COMPILATION_CONDITIONS=SCREENSHOT_BUILD build

      - name: Prepare App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          (( ${#missing[@]} == 0 )) || { echo "Missing repository Actions secrets: ${missing[*]}" >&2; exit 1; }
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Ensure bundle ID and App Store record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          jwt="$(ruby scripts/app-store-connect-jwt.rb "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          echo "ASC_JWT=$jwt" >> "$GITHUB_ENV"
          auth="Authorization: Bearer $jwt"
          bundle_json="$RUNNER_TEMP/bundle.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$bundle_json")"
          if [[ "$count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"bundleIds",attributes:{identifier:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),platform:"IOS"}})' > "$RUNNER_TEMP/create-bundle.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-bundle.json" 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          elif [[ "$count" != "1" ]]; then
            echo 'Bundle ID lookup was ambiguous.' >&2
            exit 1
          fi
          app_json="$RUNNER_TEMP/app.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[bundleId]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          app_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$app_json")"
          if [[ "$app_count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"apps",attributes:{bundleId:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),primaryLocale:"en-US",sku:ENV.fetch("APP_SKU")}})' > "$RUNNER_TEMP/create-app.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-app.json" 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          elif [[ "$app_count" != "1" ]]; then
            echo 'App lookup was ambiguous.' >&2
            exit 1
          fi

      - name: Install distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_P12" ]] || { echo 'Missing repository Actions secret: IOS_DISTRIBUTION_CERTIFICATE_P12' >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo 'Missing repository Actions secret: IOS_DISTRIBUTION_CERTIFICATE_PASSWORD' >&2; exit 1; }
          cert_path="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          chmod 600 "$cert_path"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path" | grep 'Apple Distribution'
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Archive screenshot edition
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          xcodebuild -project WeldingGasWallet.xcodeproj -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" SWIFT_ACTIVE_COMPILATION_CONDITIONS=SCREENSHOT_BUILD clean archive
          app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          while IFS= read -r -d '' framework; do codesign --force --sign - --timestamp=none "$framework"; done < <(find "$app/Frameworks" -depth -type d -name '*.framework' -print0 2>/dev/null || true)

      - name: Export and verify signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          ditto -x -k "$IPA_PATH" "$verify"
          app="$(find "$verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == "$IOS_BUNDLE_ID" ]]

      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v7
        with:
          name: WeldingGasWallet-Screenshot-TestFlight-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
