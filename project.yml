name: Shell
options:
  bundleIdPrefix: com.goodusestudios
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
targets:
  Shell:
    type: application
    platform: iOS
    sources:
      - Shell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goodusestudios.shelllab
        PRODUCT_NAME: Shell
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Shell/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
  ShellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShellTests
    dependencies:
      - target: Shell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shell:
    build:
      targets:
        Shell: all
        ShellTests: [test]
    test:
      targets:
        - ShellTests
