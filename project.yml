name: Shell
options:
  bundleIdPrefix: com.goodusestudios
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GymDayEngine:
    path: Vendor/gym-ios/GymDayEngine
targetTemplates:
  ShellApplication:
    type: application
    platform: iOS
    sources:
      - path: Shell
        excludes:
          - Resources/Info.plist
          - Resources/Info-Ads.plist
    settings:
      base:
        PRODUCT_NAME: Shell
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
targets:
  # Default target. It neither links nor initializes any advertising SDK and its
  # Info.plist contains no GAD or SKAdNetwork keys.
  Shell:
    templates: [ShellApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goodusestudios.shelllab
        INFOPLIST_FILE: Shell/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shell/Resources/Shell.entitlements
    dependencies:
      - package: GymDayEngine
        product: GymDayCore
      - package: GymDayEngine
        product: GymDayAppleAdapters
      - target: GymDayWatch
        embed: true
  # Select this target only for a reviewed ad-supported derived app.
  ShellAds:
    templates: [ShellApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goodusestudios.shelllab.ads
        INFOPLIST_FILE: Shell/Resources/Info-Ads.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ADS_ENABLED"
    dependencies:
      - package: GymDayEngine
        product: GymDayCore
      - package: GymDayEngine
        product: GymDayAppleAdapters
      - package: GoogleMobileAds
        product: GoogleMobileAds
  # Companion watchOS app, embedded only in Shell (not ShellAds) for now:
  # GymDay is the only derived app currently wiring in HealthKit/workout
  # mirroring, and a WKCompanionAppBundleIdentifier can only name one host.
  GymDayWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_NAME: GymDayWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.goodusestudios.shelllab.watchkitapp
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Watch/Resources/GymDayWatch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GymDay
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.goodusestudios.shelllab
        INFOPLIST_KEY_NSHealthShareUsageDescription: "ワークアウト中の心拍数などのデータを記録するために使用します。"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "完了したワークアウトをヘルスケアに保存するために使用します。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - package: GymDayEngine
        product: GymDayCore
      - package: GymDayEngine
        product: GymDayAppleAdapters
  ShellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShellTests
    dependencies:
      - target: Shell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ShellUITests
    dependencies:
      - target: Shell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shell:
    build:
      targets:
        Shell: all
        ShellTests: [test]
        ShellUITests: [test]
    test:
      targets:
        - ShellTests
        - ShellUITests
  ShellAds:
    build:
      targets:
        ShellAds: all
